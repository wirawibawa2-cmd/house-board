<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<meta name="description" content="House Board — a courtyard floor plan. Six units roam the house and meet as they pass.">
<title>House Board</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23000'/%3E%3Ccircle cx='16' cy='16' r='9' fill='%232EE56F'/%3E%3Crect x='11.2' y='10' width='3' height='8' rx='1.5' fill='white' transform='rotate(14 16 16)'/%3E%3Crect x='17.6' y='10' width='3' height='8' rx='1.5' fill='white' transform='rotate(14 16 16)'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #000;
    --text: #f4f6f8;
    --muted: #8e949e;
    --kai: #2ee56f;
    --scout: #2f8a46;
    --chaos: #f5f6f8;
    --red: #f03d3d;
    --blue: #8f52f0;
    --sentry: #2ad4c6;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    height: 100%;
    background: #000;
    color: var(--text);
    font-family: Outfit, "Avenir Next", "Segoe UI", sans-serif;
  }
  body { display: flex; flex-direction: column; overflow: hidden; }
  header { flex: none; padding: 16px 28px 0; }
  .top { display: flex; align-items: flex-start; justify-content: space-between; }
  .brand h1 { margin: 0; font-size: 22px; font-weight: 600; letter-spacing: 0.16em; }
  .brand p { margin: 6px 0 0; color: var(--muted); font-size: 11px; font-weight: 500; letter-spacing: 0.28em; }
  .rule { height: 1px; margin-top: 14px; background: rgba(255,255,255,0.22); }
  .legend { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px 26px; padding: 12px 0 8px; }
  .unit { display: flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 500; }
  .face { position: relative; width: 26px; height: 26px; border-radius: 50%; flex: none; }
  .face i, .face b {
    position: absolute; top: 6px; width: 4px; height: 10px; border-radius: 4px;
    background: #fff; transform: rotate(16deg);
  }
  .face i { left: 6.5px; }
  .face b { right: 6.5px; }
  .face s { position: absolute; right: -2px; bottom: -1px; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
  .face.kai { background: var(--kai); color: var(--kai); }
  .face.scout { background: var(--scout); color: var(--scout); }
  .face.chaos { background: var(--chaos); color: #6b6f78; }
  .face.chaos i, .face.chaos b { background: #23262b; }
  .face.red { background: var(--red); color: var(--red); }
  .face.blue { background: var(--blue); color: var(--blue); }
  .face.sentry { background: var(--sentry); color: var(--sentry); }
  button.icon {
    width: 36px; height: 36px; display: grid; place-items: center;
    border: 0; background: transparent; color: #f3f5f8; cursor: pointer; padding: 0;
  }
  button.icon:focus-visible { outline: 2px solid rgba(46,229,111,0.85); outline-offset: 2px; }
  main { flex: 1; min-height: 0; padding: 0 10px 10px; }
  canvas { width: 100%; height: 100%; display: block; background: #000; }
  .sr-only {
    position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
    overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0;
  }
  @media (max-width: 860px) {
    header { padding: 12px 14px 0; }
    .brand h1 { font-size: 16px; letter-spacing: 0.12em; }
    .legend { justify-content: flex-start; gap: 8px 14px; }
    .unit { font-size: 12px; }
    .face { width: 20px; height: 20px; }
  }
</style>
</head>
<body>
<header>
  <div class="top">
    <div class="brand">
      <h1>HOUSE BOARD</h1>
      <p>LARGE COURTYARD</p>
    </div>
    <button class="icon" id="full" type="button" aria-label="Enter fullscreen" title="Fullscreen">
      <svg id="full-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" aria-hidden="true">
        <path d="M8 3H3v5M16 3h5v5M8 21H3v-5M16 21h5v-5"/>
      </svg>
    </button>
  </div>
  <div class="rule"></div>
  <nav class="legend" aria-label="Units">
    <span class="unit"><span class="face kai" aria-hidden="true"><i></i><b></b><s></s></span>Kai</span>
    <span class="unit"><span class="face scout" aria-hidden="true"><i></i><b></b><s></s></span>Scout</span>
    <span class="unit"><span class="face chaos" aria-hidden="true"><i></i><b></b><s></s></span>CHAOS</span>
    <span class="unit"><span class="face red" aria-hidden="true"><i></i><b></b><s></s></span>RED</span>
    <span class="unit"><span class="face blue" aria-hidden="true"><i></i><b></b><s></s></span>BLUE</span>
    <span class="unit"><span class="face sentry" aria-hidden="true"><i></i><b></b><s></s></span>Sentry</span>
  </nav>
</header>
<main>
  <canvas id="plan" aria-label="Courtyard house floor plan. Six units roam through the rooms and across the deck."></canvas>
</main>
<p id="status" class="sr-only" aria-live="polite"></p>
<script>
(() => {
  "use strict";

  const WORLD_W = 1680;
  const WORLD_H = 1040;
  const BOT_R = 20;
  const SEPARATION = BOT_R * 2 + 6;

  const X0 = 36, XE = 214, X1 = 430, X2 = 1250, X3 = 1644;
  const Y0 = 24, YW = 146, Y1 = 336, YM = 568, YG = 758, YK = 488, Y2 = 812, Y3 = 1014;

  const ROOMS = [
    { id: "living", x: X1, y: Y0, w: X2 - X1, h: Y1 - Y0 },
    { id: "master", x: X0, y: YW, w: X1 - X0, h: YM - YW },
    { id: "ensuite", x: X0, y: YM, w: XE - X0, h: YG - YM },
    { id: "guest", x: XE, y: YM, w: X1 - XE, h: YG - YM },
    { id: "bath", x: X0, y: YG, w: X1 - X0, h: Y3 - YG },
    { id: "kitchen", x: X2, y: YW, w: X3 - X2, h: YK - YW },
    { id: "study", x: X2, y: YK, w: X3 - X2, h: Y3 - YK },
    { id: "court", x: X1, y: Y1, w: X2 - X1, h: Y2 - Y1 },
    { id: "lounge", x: X1, y: Y2, w: X2 - X1, h: Y3 - Y2 }
  ];
  const roomById = Object.fromEntries(ROOMS.map((room) => [room.id, room]));

  const DOORS = [
    { a: "master", b: "living", orient: "v", x: X1, y: 188, h: 112 },
    { a: "master", b: "court", orient: "v", x: X1, y: 390, h: 140 },
    { a: "master", b: "ensuite", orient: "h", y: YM, x: 78, w: 110 },
    { a: "master", b: "guest", orient: "h", y: YM, x: 268, w: 120 },
    { a: "ensuite", b: "guest", orient: "v", x: XE, y: 600, h: 110 },
    { a: "ensuite", b: "bath", orient: "h", y: YG, x: 70, w: 110 },
    { a: "guest", b: "bath", orient: "h", y: YG, x: 270, w: 120 },
    { a: "guest", b: "court", orient: "v", x: X1, y: 600, h: 120 },
    { a: "bath", b: "lounge", orient: "v", x: X1, y: 860, h: 112 },
    { a: "kitchen", b: "living", orient: "v", x: X2, y: 188, h: 112 },
    { a: "kitchen", b: "court", orient: "v", x: X2, y: 360, h: 108 },
    { a: "kitchen", b: "study", orient: "h", y: YK, x: 1368, w: 140 },
    { a: "study", b: "court", orient: "v", x: X2, y: 560, h: 150 },
    { a: "study", b: "lounge", orient: "v", x: X2, y: 868, h: 112 },
    { a: "living", b: "court", orient: "h", y: Y1, x: 620, w: 430 },
    { a: "court", b: "lounge", orient: "h", y: Y2, x: 650, w: 390 }
  ];

  const court = roomById.court;
  const POOL = {
    x: court.x + Math.round((court.w - 400) / 2),
    y: court.y + Math.round((court.h - 196) / 2),
    w: 400,
    h: 196,
    r: 0
  };

  const graph = Object.fromEntries(ROOMS.map((room) => [room.id, []]));
  for (const door of DOORS) {
    graph[door.a].push({ to: door.b, door });
    graph[door.b].push({ to: door.a, door });
  }

  const navRects = [];
  for (const room of ROOMS) {
    navRects.push({ x: room.x + BOT_R, y: room.y + BOT_R, w: room.w - BOT_R * 2, h: room.h - BOT_R * 2 });
  }
  for (const door of DOORS) {
    if (door.orient === "v") {
      navRects.push({ x: door.x - BOT_R, y: door.y + BOT_R, w: BOT_R * 2, h: door.h - BOT_R * 2 });
    } else {
      navRects.push({ x: door.x + BOT_R, y: door.y - BOT_R, w: door.w - BOT_R * 2, h: BOT_R * 2 });
    }
  }

  const BLOCKS = [];
  {
    const master = roomById.master;
    const guest = roomById.guest;
    const bath = roomById.bath;
    const liv = roomById.living;
    const bedW = 214;
    const bedH = 156;
    BLOCKS.push({
      x: master.x + (master.w - bedW) / 2,
      y: master.y + 78,
      w: bedW,
      h: bedH,
      r: 6
    });
    BLOCKS.push({ x: guest.x + 36, y: guest.y + 24, w: 100, h: 72, r: 4 });
    BLOCKS.push({ kind: "ellipse", x: bath.x + 108, y: bath.y + 118, rx: 46, ry: 68 });
    BLOCKS.push({ x: liv.x + 604, y: liv.y + 72, w: 84, h: 156, r: 4 });
  }

  const canvas = document.getElementById("plan");
  const ctx = canvas.getContext("2d");
  const statusNode = document.getElementById("status");
  const view = { s: 1, x: 0, y: 0 };

  function contains(rect, x, y) {
    return x >= rect.x && y >= rect.y && x <= rect.x + rect.w && y <= rect.y + rect.h;
  }

  function sdf(px, py, rect) {
    const rad = rect.r || 0;
    const cx = rect.x + rect.w / 2;
    const cy = rect.y + rect.h / 2;
    const dx = Math.abs(px - cx) - (rect.w / 2 - rad);
    const dy = Math.abs(py - cy) - (rect.h / 2 - rad);
    return Math.min(Math.max(dx, dy), 0) + Math.hypot(Math.max(dx, 0), Math.max(dy, 0)) - rad;
  }

  function hitsPool(x, y) {
    return sdf(x, y, POOL) < BOT_R - 0.2;
  }

  function hitsBlock(x, y) {
    for (const block of BLOCKS) {
      if (block.kind === "ellipse") {
        const dx = (x - block.x) / (block.rx + BOT_R);
        const dy = (y - block.y) / (block.ry + BOT_R);
        if (dx * dx + dy * dy < 1) return true;
      } else if (sdf(x, y, block) < BOT_R - 0.2) return true;
    }
    return false;
  }

  function inWalkable(x, y) {
    if (hitsPool(x, y) || hitsBlock(x, y)) return false;
    for (const rect of navRects) if (contains(rect, x, y)) return true;
    return false;
  }

  function zoneAt(x, y) {
    for (const room of ROOMS) {
      if (x >= room.x && y >= room.y && x < room.x + room.w && y < room.y + room.h) return room.id;
    }
    for (const door of DOORS) {
      if (door.orient === "v" && Math.abs(x - door.x) <= BOT_R && y >= door.y && y <= door.y + door.h) return door.a;
      if (door.orient === "h" && Math.abs(y - door.y) <= BOT_R && x >= door.x && x <= door.x + door.w) return door.a;
    }
    return null;
  }

  function doorCenter(door) {
    return door.orient === "v"
      ? { x: door.x, y: door.y + door.h / 2 }
      : { x: door.x + door.w / 2, y: door.y };
  }

  function route(from, to) {
    if (!from || from === to) return [to];
    const queue = [[from]];
    const seen = new Set([from]);
    while (queue.length) {
      const path = queue.shift();
      const here = path[path.length - 1];
      for (const edge of graph[here] || []) {
        if (seen.has(edge.to)) continue;
        const next = path.concat(edge.to);
        if (edge.to === to) return next;
        seen.add(edge.to);
        queue.push(next);
      }
    }
    return [from, to];
  }

  function randomPoint(roomId) {
    const room = roomById[roomId];
    for (let i = 0; i < 80; i++) {
      const x = room.x + BOT_R + 10 + Math.random() * Math.max(8, room.w - BOT_R * 2 - 20);
      const y = room.y + BOT_R + 10 + Math.random() * Math.max(8, room.h - BOT_R * 2 - 20);
      if (inWalkable(x, y)) return { x, y };
    }
    for (let y = room.y + BOT_R + 6; y <= room.y + room.h - BOT_R - 4; y += 16) {
      for (let x = room.x + BOT_R + 6; x <= room.x + room.w - BOT_R - 4; x += 16) {
        if (inWalkable(x, y)) return { x, y };
      }
    }
    return { x: room.x + room.w / 2, y: room.y + room.h / 2 };
  }

  function waypoints(from, to, dest) {
    const rooms = route(from, to);
    const points = [];
    for (let i = 0; i < rooms.length - 1; i++) {
      const edge = (graph[rooms[i]] || []).find((item) => item.to === rooms[i + 1]);
      if (edge) points.push(doorCenter(edge.door));
    }
    points.push(dest);
    return points;
  }

  function segmentHitsPool(x1, y1, x2, y2) {
    for (let i = 1; i < 10; i++) {
      const t = i / 10;
      if (hitsPool(x1 + (x2 - x1) * t, y1 + (y2 - y1) * t)) return true;
    }
    return false;
  }

  function deckSides() {
    return [
      { x: POOL.x - 64, y: POOL.y + POOL.h / 2 },
      { x: POOL.x + POOL.w + 64, y: POOL.y + POOL.h / 2 },
      { x: POOL.x + POOL.w / 2, y: POOL.y - 46 },
      { x: POOL.x + POOL.w / 2, y: POOL.y + POOL.h + 46 }
    ].filter((spot) => inWalkable(spot.x, spot.y));
  }

  const BOTS = [
    { name: "Kai", color: "#2ee56f", eye: "#ffffff", pip: "#2ee56f", speed: 96, wobble: 6, freq: 1.3, x: POOL.x - 70, y: POOL.y + 34 },
    { name: "Scout", color: "#2f8a46", eye: "#ffffff", pip: "#2f8a46", speed: 104, wobble: 5, freq: 1.5, x: 980, y: 930 },
    { name: "CHAOS", color: "#f5f6f8", eye: "#23262b", pip: "#6a6e76", speed: 116, wobble: 11, freq: 2, x: 720, y: 924 },
    { name: "RED", color: "#f03d3d", eye: "#ffffff", pip: "#f03d3d", speed: 108, wobble: 7, freq: 1.7, x: POOL.x - 66, y: POOL.y + POOL.h - 26 },
    { name: "BLUE", color: "#8f52f0", eye: "#ffffff", pip: "#8f52f0", speed: 90, wobble: 4, freq: 1.15, x: POOL.x + POOL.w + 70, y: POOL.y + 36 },
    { name: "Sentry", color: "#2ad4c6", eye: "#ffffff", pip: "#2ad4c6", speed: 100, wobble: 5, freq: 1.25, x: POOL.x + POOL.w + 66, y: POOL.y + POOL.h - 28 }
  ];

  function chooseDestination(bot, prefer) {
    const here = zoneAt(bot.x, bot.y) || bot.zone || "lounge";
    bot.zone = here;
    const ids = ROOMS.map((room) => room.id);
    let dest = prefer || here;
    if (!prefer && Math.random() < 0.86) {
      const bag = ids.concat(["court", "lounge", "living"]);
      dest = bag[Math.floor(Math.random() * bag.length)];
      if (dest === here) dest = ids[Math.floor(Math.random() * ids.length)];
    }
    bot.wps = waypoints(here, dest, randomPoint(dest));
    bot.best = Infinity;
    bot.stuck = 0;
    bot.dwell = 0;
    bot.trip = bot.speed * (0.92 + Math.random() * 0.16);
  }

  BOTS.forEach((bot, index) => {
    bot.vx = 0;
    bot.vy = 0;
    bot.heading = 0;
    bot.wps = [];
    bot.dwell = 0;
    bot.stuck = 0;
    bot.best = Infinity;
    bot.phase = index * 1.3;
    bot.mode = "roam";
    bot.partner = null;
    bot.extra = null;
    bot.leader = false;
    bot.modeTime = 0;
    bot.cooldown = 0.2;
    bot.lastSocial = -index * 1.6;
    bot.pulse = 0;
    bot.repath = 0;
    bot.sideSign = index % 2 === 0 ? 1 : -1;
    bot.joined = false;
    if (!inWalkable(bot.x, bot.y)) {
      const spot = randomPoint("court");
      bot.x = spot.x;
      bot.y = spot.y;
    }
    bot.px = bot.x;
    bot.py = bot.y;
    bot.zone = zoneAt(bot.x, bot.y) || "court";
    chooseDestination(bot);
  });

  function groupOf(bot) {
    const out = [];
    const seen = new Set();
    const queue = [bot];
    while (queue.length) {
      const cur = queue.pop();
      if (!cur || seen.has(cur) || cur.mode === "roam") continue;
      seen.add(cur);
      out.push(cur);
      queue.push(cur.partner, cur.extra);
    }
    return out.length ? out : [bot];
  }

  function releaseRoam(bot, time, destId) {
    bot.mode = "roam";
    bot.partner = null;
    bot.extra = null;
    bot.leader = false;
    bot.joined = false;
    bot.cooldown = 1.3 + Math.random() * 1.2;
    bot.lastSocial = time;
    chooseDestination(bot, destId);
  }

  function beginCluster(a, b, third, time) {
    const dur = 1.15 + Math.random() * 0.4;
    for (const bot of [a, b, third]) {
      bot.mode = "cluster";
      bot.leader = false;
      bot.modeTime = dur;
      bot.wps = [];
      bot.pulse = 1;
      bot.lastSocial = time;
      bot.stuck = 0;
    }
    a.partner = b;
    b.partner = a;
    third.partner = a;
    a.extra = third;
    b.extra = third;
    third.extra = b;
  }

  function beginGreet(a, b, time) {
    const dur = 0.85 + Math.random() * 0.5;
    for (const bot of [a, b]) {
      bot.mode = "greet";
      bot.leader = false;
      bot.extra = null;
      bot.joined = false;
      bot.modeTime = dur;
      bot.wps = [];
      bot.pulse = 1;
      bot.lastSocial = time;
      bot.stuck = 0;
    }
    a.partner = b;
    b.partner = a;
    const third = BOTS.find((bot) => (
      bot !== a && bot !== b && bot.mode === "roam" && bot.cooldown <= 0
      && Math.hypot(bot.x - a.x, bot.y - a.y) < 200
      && Math.hypot(bot.x - b.x, bot.y - b.y) < 220
    ));
    if (third && Math.random() < 0.72) beginCluster(a, b, third, time);
  }

  function beginPair(a, b, time) {
    const dur = 3.5 + Math.random() * 1.7;
    a.mode = b.mode = "pair";
    a.partner = b;
    b.partner = a;
    a.extra = b.extra = null;
    a.leader = true;
    b.leader = false;
    a.modeTime = b.modeTime = dur;
    a.sideSign = 1;
    b.sideSign = -1;
    const here = zoneAt(a.x, a.y) || a.zone || "court";
    const options = ROOMS.map((room) => room.id).filter((id) => id !== here);
    const dest = options[Math.floor(Math.random() * options.length)];
    a.zone = here;
    a.wps = waypoints(here, dest, randomPoint(dest));
    a.best = Infinity;
    a.stuck = 0;
    b.wps = [];
    a.lastSocial = b.lastSocial = time;
  }

  function beginSeek(a, b, time) {
    a.mode = "seek";
    a.partner = b;
    a.extra = null;
    a.leader = false;
    a.modeTime = 7;
    a.repath = 0;
    a.wps = [];
    a.lastSocial = time;
  }

  function endSocial(bot, time) {
    const members = groupOf(bot).filter((member) => member.mode !== "roam");
    if (!members.length) return;
    if (members.length === 2 && members.every((member) => member.mode === "greet") && Math.random() < 0.7) {
      beginPair(members[0], members[1], time);
      return;
    }
    const rooms = ROOMS.map((room) => room.id).sort(() => Math.random() - 0.5);
    members.forEach((member, index) => releaseRoam(member, time, rooms[index % rooms.length]));
  }

  function approachPoint(seeker, target) {
    const dx = target.x - seeker.x;
    const dy = target.y - seeker.y;
    const dist = Math.hypot(dx, dy) || 1;
    const x = target.x - (dx / dist) * (SEPARATION + 16);
    const y = target.y - (dy / dist) * (SEPARATION + 16);
    if (inWalkable(x, y)) return { x, y };
    const sides = deckSides().sort((p, q) => Math.hypot(p.x - seeker.x, p.y - seeker.y) - Math.hypot(q.x - seeker.x, q.y - seeker.y));
    return sides[0] || { x: target.x, y: target.y };
  }

  function refreshSeek(bot) {
    const target = bot.partner;
    if (!target) return;
    const here = zoneAt(bot.x, bot.y) || bot.zone || "lounge";
    const there = zoneAt(target.x, target.y) || target.zone || here;
    bot.zone = here;
    const spot = approachPoint(bot, target);
    let points = here === there && !segmentHitsPool(bot.x, bot.y, spot.x, spot.y)
      ? [spot]
      : waypoints(here, there, spot);
    if (points[0] && segmentHitsPool(bot.x, bot.y, points[0].x, points[0].y)) {
      const side = deckSides().sort((p, q) => Math.hypot(p.x - bot.x, p.y - bot.y) - Math.hypot(q.x - bot.x, q.y - bot.y))[0];
      if (side) points = [side].concat(points);
    }
    bot.wps = points;
    bot.best = Infinity;
    bot.stuck = 0;
  }

  let noticeAt = 0.4;
  let seekAt = 0.8;

  function socialDirector(time) {
    if (time >= noticeAt) {
      noticeAt = time + 0.28;
      const busy = BOTS.some((bot) => bot.mode === "greet" || bot.mode === "cluster" || bot.mode === "pair");
      if (!busy) {
        for (let i = 0; i < BOTS.length; i++) {
          for (let j = i + 1; j < BOTS.length; j++) {
            const a = BOTS[i];
            const b = BOTS[j];
            if (a.mode !== "roam" || b.mode !== "roam" || a.cooldown > 0 || b.cooldown > 0) continue;
            const dist = Math.hypot(a.x - b.x, a.y - b.y);
            const reach = a.zone && a.zone === b.zone ? 136 : 104;
            if (dist < reach && dist > SEPARATION - 2) {
              beginGreet(a, b, time);
              return;
            }
          }
        }
      }
    }
    if (time < seekAt) return;
    seekAt = time + 1.2 + Math.random() * 0.8;
    if (BOTS.some((bot) => bot.mode !== "roam")) return;
    const idle = BOTS.filter((bot) => bot.cooldown <= 0).sort((a, b) => a.lastSocial - b.lastSocial);
    if (idle.length < 2) return;
    beginSeek(idle[0], idle[1 + Math.floor(Math.random() * (idle.length - 1))] || idle[1], time);
  }

  function drive(bot, dx, dy, dist, speed, dt) {
    const desiredX = (dx / dist) * speed;
    const desiredY = (dy / dist) * speed;
    const accel = 340 * dt;
    let sx = desiredX - bot.vx;
    let sy = desiredY - bot.vy;
    const sl = Math.hypot(sx, sy);
    if (sl > accel) {
      sx = (sx / sl) * accel;
      sy = (sy / sl) * accel;
    }
    bot.vx += sx;
    bot.vy += sy;
    const velocity = Math.hypot(bot.vx, bot.vy);
    if (velocity > speed * 1.05) {
      bot.vx = (bot.vx / velocity) * speed;
      bot.vy = (bot.vy / velocity) * speed;
    }
  }

  function cruise(bot, dt, time) {
    if (!bot.wps.length) {
      bot.dwell -= dt;
      bot.vx *= Math.exp(-3 * dt);
      bot.vy *= Math.exp(-3 * dt);
      if (bot.dwell <= 0) chooseDestination(bot);
      return;
    }
    const wp = bot.wps[0];
    let dx = wp.x - bot.x;
    let dy = wp.y - bot.y;
    let dist = Math.hypot(dx, dy);
    if (dist < 18) {
      bot.wps.shift();
      bot.best = Infinity;
      bot.stuck = 0;
      if (!bot.wps.length) bot.dwell = bot.mode === "pair" ? 0.3 : 0.18 + Math.random() * 0.4;
      return;
    }
    if (dist < bot.best - 0.8) {
      bot.best = dist;
      bot.stuck = 0;
    } else bot.stuck += dt;
    if (bot.stuck > 1.45) {
      chooseDestination(bot);
      return;
    }
    if (dist > 50 && bot.mode === "roam") {
      const wob = Math.sin(time * bot.freq + bot.phase) * bot.wobble;
      const ox = dx;
      const oy = dy;
      dx = ox + (-oy / dist) * wob;
      dy = oy + (ox / dist) * wob;
      dist = Math.hypot(dx, dy) || 1;
    }
    const arrive = bot.wps.length === 1 ? Math.min(1, dist / 80) : 1;
    drive(bot, dx, dy, dist, (bot.trip || bot.speed) * Math.max(0.32, arrive), dt);
  }

  function steerFollow(bot, dt) {
    const lead = bot.partner;
    if (!lead) return;
    let lx = lead.vx;
    let ly = lead.vy;
    let speed = Math.hypot(lx, ly);
    if (speed < 10) {
      lx = Math.sin(lead.heading);
      ly = -Math.cos(lead.heading);
      speed = Math.hypot(lx, ly) || 1;
    }
    let tx = lead.x + (-ly / speed) * (SEPARATION + 12) * bot.sideSign;
    let ty = lead.y + (lx / speed) * (SEPARATION + 12) * bot.sideSign;
    if (!inWalkable(tx, ty)) {
      tx = lead.x - (lx / speed) * (SEPARATION + 14);
      ty = lead.y - (ly / speed) * (SEPARATION + 14);
    }
    if (!inWalkable(tx, ty)) {
      tx = lead.x;
      ty = lead.y;
    }
    const dx = tx - bot.x;
    const dy = ty - bot.y;
    drive(bot, dx, dy, Math.hypot(dx, dy) || 1, Math.max(40, Math.hypot(lead.vx, lead.vy), lead.speed * 0.9), dt);
  }

  function steer(bot, dt, time) {
    if (bot.mode === "greet" || bot.mode === "cluster") {
      bot.vx *= Math.exp(-7 * dt);
      bot.vy *= Math.exp(-7 * dt);
      return;
    }
    if (bot.mode === "seek") {
      const other = bot.partner;
      if (!other || (other.mode !== "roam" && other.mode !== "seek")) {
        bot.mode = "roam";
        bot.partner = null;
        bot.cooldown = 1;
        bot.wps = [];
        bot.dwell = 0.05;
        return;
      }
      if (Math.hypot(other.x - bot.x, other.y - bot.y) < 84) {
        beginGreet(bot, other, time);
        return;
      }
      bot.repath -= dt;
      if (bot.repath <= 0 || !bot.wps.length) {
        bot.repath = 0.4;
        refreshSeek(bot);
      }
      cruise(bot, dt, time);
      return;
    }
    if (bot.mode === "pair" && !bot.leader) {
      steerFollow(bot, dt);
      return;
    }
    if (bot.mode === "roam") {
      const incoming = BOTS.find((other) => other.mode === "seek" && other.partner === bot);
      if (incoming && Math.hypot(incoming.x - bot.x, incoming.y - bot.y) < 280) {
        bot.vx *= Math.exp(-4.5 * dt);
        bot.vy *= Math.exp(-4.5 * dt);
        return;
      }
    }
    cruise(bot, dt, time);
  }

  function move(bot, dt) {
    const nx = bot.x + bot.vx * dt;
    const ny = bot.y + bot.vy * dt;
    if (inWalkable(nx, ny)) {
      bot.x = nx;
      bot.y = ny;
      return;
    }
    const xOk = inWalkable(nx, bot.y);
    const yOk = inWalkable(bot.x, ny);
    if (xOk && !yOk) {
      bot.x = nx;
      bot.vy *= -0.62;
    } else if (yOk && !xOk) {
      bot.y = ny;
      bot.vx *= -0.62;
    } else if (xOk && yOk) {
      if (Math.abs(bot.vx) >= Math.abs(bot.vy)) {
        bot.x = nx;
        bot.vy *= -0.62;
      } else {
        bot.y = ny;
        bot.vx *= -0.62;
      }
    } else {
      bot.vx *= -0.5;
      bot.vy *= -0.5;
    }
  }

  function separate(a, b) {
    let dx = b.x - a.x;
    let dy = b.y - a.y;
    let dist = Math.hypot(dx, dy);
    if (dist >= SEPARATION) return;
    if (dist < 0.001) { dx = 1; dy = 0; dist = 1; }
    const overlap = SEPARATION - dist;
    const nx = dx / dist;
    const ny = dy / dist;
    const push = overlap / 2;
    const ax = a.x - nx * push;
    const ay = a.y - ny * push;
    const bx = b.x + nx * push;
    const by = b.y + ny * push;
    if (inWalkable(ax, ay) && inWalkable(bx, by)) {
      a.x = ax; a.y = ay; b.x = bx; b.y = by;
    } else if (inWalkable(a.x - nx * overlap, a.y - ny * overlap)) {
      a.x -= nx * overlap; a.y -= ny * overlap;
    } else if (inWalkable(b.x + nx * overlap, b.y + ny * overlap)) {
      b.x += nx * overlap; b.y += ny * overlap;
    }
    const rel = (b.vx - a.vx) * nx + (b.vy - a.vy) * ny;
    if (rel < 0) {
      a.vx += nx * rel * 0.5;
      a.vy += ny * rel * 0.5;
      b.vx -= nx * rel * 0.5;
      b.vy -= ny * rel * 0.5;
    }
  }

  function lerpAngle(a, b, t) {
    let d = b - a;
    while (d > Math.PI) d -= Math.PI * 2;
    while (d < -Math.PI) d += Math.PI * 2;
    return a + d * t;
  }

  function faceToward(bot, tx, ty, maxLean, dt) {
    let desired = Math.atan2(ty - bot.y, tx - bot.x) + Math.PI / 2;
    while (desired > Math.PI) desired -= Math.PI * 2;
    while (desired < -Math.PI) desired += Math.PI * 2;
    desired = Math.max(-maxLean, Math.min(maxLean, desired));
    bot.heading = lerpAngle(bot.heading, desired, 1 - Math.exp(-6.5 * dt));
  }

  function step(dt, time) {
    for (const bot of BOTS) if (bot.cooldown > 0) bot.cooldown -= dt;
    socialDirector(time);
    for (const bot of BOTS) if (bot.mode !== "roam" && bot.mode !== "seek") bot.modeTime -= dt;
    for (const bot of BOTS) {
      if (bot.mode !== "roam" && bot.mode !== "seek" && bot.modeTime <= 0) endSocial(bot, time);
      if (bot.mode === "seek" && bot.modeTime <= 0) {
        bot.mode = "roam";
        bot.partner = null;
        bot.cooldown = 1.1;
        bot.wps = [];
        bot.dwell = 0;
      }
    }
    for (const bot of BOTS) steer(bot, dt, time);
    for (const bot of BOTS) move(bot, dt);
    for (let n = 0; n < 4; n++) {
      for (let i = 0; i < BOTS.length; i++) {
        for (let j = i + 1; j < BOTS.length; j++) separate(BOTS[i], BOTS[j]);
      }
    }
    for (const bot of BOTS) {
      if (!inWalkable(bot.x, bot.y)) {
        bot.x = bot.px;
        bot.y = bot.py;
        bot.vx *= -0.45;
        bot.vy *= -0.45;
      } else {
        bot.px = bot.x;
        bot.py = bot.y;
      }
      const zone = zoneAt(bot.x, bot.y);
      if (zone) bot.zone = zone;
      if ((bot.mode === "greet" || bot.mode === "cluster") && (bot.partner || bot.extra)) {
        const mates = [bot.partner, bot.extra].filter(Boolean);
        const tx = mates.reduce((sum, mate) => sum + mate.x, 0) / mates.length;
        const ty = mates.reduce((sum, mate) => sum + mate.y, 0) / mates.length;
        faceToward(bot, tx, ty, 0.95, dt);
        bot.pulse = 0.45 + 0.55 * Math.abs(Math.sin(time * 7));
      } else {
        bot.pulse *= Math.exp(-4 * dt);
        const incoming = BOTS.find((other) => other.mode === "seek" && other.partner === bot);
        const speed = Math.hypot(bot.vx, bot.vy);
        if (incoming && Math.hypot(incoming.x - bot.x, incoming.y - bot.y) < 280) faceToward(bot, incoming.x, incoming.y, 0.8, dt);
        else if (speed > 12) faceToward(bot, bot.x + bot.vx, bot.y + bot.vy, 0.24, dt);
      }
      if (bot.mode === "seek") bot.modeTime -= dt;
    }
  }

  function resize() {
    const rect = canvas.getBoundingClientRect();
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    const w = Math.max(1, Math.round(rect.width * dpr));
    const h = Math.max(1, Math.round(rect.height * dpr));
    if (canvas.width !== w || canvas.height !== h) {
      canvas.width = w;
      canvas.height = h;
    }
    view.s = Math.min(w / WORLD_W, h / WORLD_H);
    view.x = (w - WORLD_W * view.s) / 2;
    view.y = (h - WORLD_H * view.s) / 2;
  }

  function pathRound(x, y, w, h, r) {
    const rr = Math.max(0, Math.min(r, Math.abs(w) / 2, Math.abs(h) / 2));
    ctx.beginPath();
    ctx.moveTo(x + rr, y);
    ctx.arcTo(x + w, y, x + w, y + h, rr);
    ctx.arcTo(x + w, y + h, x, y + h, rr);
    ctx.arcTo(x, y + h, x, y, rr);
    ctx.arcTo(x, y, x + w, y, rr);
    ctx.closePath();
  }

  function strokeRound(x, y, w, h, r) {
    pathRound(x, y, w, h, r);
    ctx.stroke();
  }

  function line(x1, y1, x2, y2) {
    ctx.beginPath();
    ctx.moveTo(x1, y1);
    ctx.lineTo(x2, y2);
    ctx.stroke();
  }

  function gapsOn(start, end, doors, axis) {
    const cuts = doors
      .map((door) => (axis === "v" ? [door.y, door.y + door.h] : [door.x, door.x + door.w]))
      .filter((cut) => cut[1] > start && cut[0] < end)
      .map((cut) => [Math.max(start, cut[0]), Math.min(end, cut[1])])
      .sort((a, b) => a[0] - b[0]);
    const spans = [];
    let cursor = start;
    for (const cut of cuts) {
      if (cut[0] > cursor) spans.push([cursor, cut[0]]);
      cursor = Math.max(cursor, cut[1]);
    }
    if (cursor < end) spans.push([cursor, end]);
    return spans;
  }

  function vWall(x, y0, y1, doors) {
    ctx.beginPath();
    for (const span of gapsOn(y0, y1, doors, "v")) {
      ctx.moveTo(x, span[0]);
      ctx.lineTo(x, span[1]);
    }
    ctx.stroke();
  }

  function hWall(y, x0, x1, doors) {
    ctx.beginPath();
    for (const span of gapsOn(x0, x1, doors, "h")) {
      ctx.moveTo(span[0], y);
      ctx.lineTo(span[1], y);
    }
    ctx.stroke();
  }

  function drawWalls() {
    ctx.save();
    ctx.strokeStyle = "#e6ebf2";
    ctx.lineWidth = 2.5;
    ctx.lineJoin = "miter";
    ctx.lineCap = "butt";
    ctx.beginPath();
    ctx.moveTo(X1, Y0);
    ctx.lineTo(X2, Y0);
    ctx.lineTo(X2, YW);
    ctx.lineTo(X3, YW);
    ctx.lineTo(X3, Y3);
    ctx.lineTo(X0, Y3);
    ctx.lineTo(X0, YW);
    ctx.lineTo(X1, YW);
    ctx.lineTo(X1, Y0);
    ctx.closePath();
    ctx.stroke();
    vWall(X1, YW, Y3, DOORS.filter((door) => door.orient === "v" && door.x === X1));
    vWall(X2, YW, Y3, DOORS.filter((door) => door.orient === "v" && door.x === X2));
    vWall(XE, YM, YG, DOORS.filter((door) => door.orient === "v" && door.x === XE));
    hWall(Y1, X1, X2, DOORS.filter((door) => door.orient === "h" && door.y === Y1));
    hWall(YM, X0, X1, DOORS.filter((door) => door.orient === "h" && door.y === YM));
    hWall(YG, X0, X1, DOORS.filter((door) => door.orient === "h" && door.y === YG));
    hWall(YK, X2, X3, DOORS.filter((door) => door.orient === "h" && door.y === YK));
    hWall(Y2, X1, X2, DOORS.filter((door) => door.orient === "h" && door.y === Y2));
    ctx.restore();
  }

  function drawDeck() {
    ctx.save();
    ctx.beginPath();
    ctx.rect(court.x, court.y, court.w, court.h);
    ctx.clip();
    ctx.beginPath();
    ctx.strokeStyle = "rgba(255,255,255,0.06)";
    ctx.lineWidth = 1;
    for (let x = court.x; x <= court.x + court.w; x += 34) {
      ctx.moveTo(x, court.y);
      ctx.lineTo(x, court.y + court.h);
    }
    for (let y = court.y; y <= court.y + court.h; y += 34) {
      ctx.moveTo(court.x, y);
      ctx.lineTo(court.x + court.w, y);
    }
    ctx.stroke();
    ctx.restore();
  }

  function drawPool() {
    ctx.save();
    ctx.fillStyle = "#146068";
    ctx.fillRect(POOL.x, POOL.y, POOL.w, POOL.h);
    ctx.strokeStyle = "rgba(186, 220, 220, 0.75)";
    ctx.lineWidth = 1.6;
    ctx.strokeRect(POOL.x + 0.5, POOL.y + 0.5, POOL.w - 1, POOL.h - 1);
    ctx.strokeStyle = "rgba(186, 220, 220, 0.28)";
    ctx.strokeRect(POOL.x + 9.5, POOL.y + 9.5, POOL.w - 19, POOL.h - 19);
    ctx.restore();
  }

  function drawFurniture() {
    const liv = roomById.living;
    const master = roomById.master;
    const guest = roomById.guest;
    const ensuite = roomById.ensuite;
    const bath = roomById.bath;
    const kit = roomById.kitchen;
    const study = roomById.study;
    const lounge = roomById.lounge;
    ctx.save();
    ctx.strokeStyle = "rgba(214, 220, 230, 0.8)";
    ctx.lineWidth = 1.45;
    ctx.lineJoin = "round";
    ctx.lineCap = "round";

    strokeRound(liv.x + 118, liv.y + 34, 246, 50, 8);
    strokeRound(liv.x + 136, liv.y + 42, 68, 20, 4);
    strokeRound(liv.x + 220, liv.y + 42, 68, 20, 4);
    strokeRound(liv.x + 150, liv.y + 118, 124, 56, 4);
    strokeRound(liv.x + 138, liv.y + 206, 54, 48, 8);
    strokeRound(liv.x + 262, liv.y + 206, 54, 48, 8);
    strokeRound(liv.x + 604, liv.y + 72, 84, 156, 4);
    for (let i = 0; i < 3; i++) {
      strokeRound(liv.x + 576, liv.y + 88 + i * 46, 20, 20, 3);
      strokeRound(liv.x + 696, liv.y + 88 + i * 46, 20, 20, 3);
    }

    const bedX = master.x + (master.w - 214) / 2;
    const bedY = master.y + 78;
    strokeRound(bedX, bedY, 214, 156, 6);
    strokeRound(bedX + 18, bedY + 14, 78, 30, 5);
    strokeRound(bedX + 116, bedY + 14, 78, 30, 5);
    line(bedX, bedY + 74, bedX + 214, bedY + 74);
    strokeRound(bedX - 40, bedY + 8, 30, 34, 3);
    strokeRound(bedX + 224, bedY + 8, 30, 34, 3);

    strokeRound(ensuite.x + 28, ensuite.y + 28, 78, 78, 6);
    ctx.beginPath();
    ctx.arc(ensuite.x + 67, ensuite.y + 67, 8, 0, Math.PI * 2);
    ctx.stroke();

    strokeRound(guest.x + 36, guest.y + 24, 100, 72, 5);
    strokeRound(guest.x + 46, guest.y + 32, 34, 16, 3);
    strokeRound(guest.x + 88, guest.y + 32, 34, 16, 3);

    ctx.beginPath();
    ctx.ellipse(bath.x + 108, bath.y + 118, 46, 68, 0, 0, Math.PI * 2);
    ctx.stroke();
    ctx.beginPath();
    ctx.ellipse(bath.x + 108, bath.y + 118, 32, 52, 0, 0, Math.PI * 2);
    ctx.stroke();
    strokeRound(bath.x + 190, bath.y + bath.h - 58, 150, 28, 3);
    ctx.beginPath();
    ctx.arc(bath.x + 250, bath.y + bath.h - 44, 8, 0, Math.PI * 2);
    ctx.stroke();

    strokeRound(kit.x + 16, kit.y + 16, kit.w - 34, 40, 3);
    strokeRound(kit.x + kit.w - 50, kit.y + 16, 34, kit.h - 64, 3);
    ctx.beginPath();
    ctx.arc(kit.x + 118, kit.y + 36, 10, 0, Math.PI * 2);
    ctx.stroke();

    strokeRound(study.x + 148, study.y + 64, 76, 200, 4);
    strokeRound(study.x + 104, study.y + 140, 34, 40, 4);
    strokeRound(study.x + 64, study.y + study.h - 88, 250, 48, 10);

    strokeRound(lounge.x + 210, lounge.y + lounge.h - 54, 400, 32, 6);
    ctx.restore();
  }

  function mix(hex, target, t) {
    const parse = (value) => {
      const n = parseInt(value.slice(1), 16);
      return [(n >> 16) & 255, (n >> 8) & 255, n & 255];
    };
    const a = parse(hex);
    const b = parse(target);
    return `rgb(${a.map((channel, i) => Math.round(channel + (b[i] - channel) * t)).join(",")})`;
  }

  function capsule(x, y, w, h, rot) {
    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(rot);
    pathRound(-w / 2, -h / 2, w, h, w / 2);
    ctx.fill();
    ctx.restore();
  }

  function drawBot(bot) {
    const r = BOT_R;
    const scale = r / 22;
    ctx.save();
    ctx.translate(bot.x, bot.y);
    ctx.rotate(bot.heading);
    const body = ctx.createRadialGradient(-r * 0.35, -r * 0.4, r * 0.1, 0, 0, r);
    body.addColorStop(0, mix(bot.color, "#ffffff", bot.name === "CHAOS" ? 0.25 : 0.16));
    body.addColorStop(0.6, bot.color);
    body.addColorStop(1, mix(bot.color, "#000000", bot.name === "CHAOS" ? 0.05 : 0.1));
    ctx.fillStyle = body;
    ctx.beginPath();
    ctx.arc(0, 0, r, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = bot.eye;
    capsule(-5.5 * scale, -3.2 * scale, 6.6 * scale, 15.4 * scale, 0.22);
    capsule(5.5 * scale, -3.2 * scale, 6.6 * scale, 15.4 * scale, 0.22);
    const pipR = r * 0.18 * (1 + bot.pulse * 0.16);
    const pipD = r + pipR * 0.42;
    const pipX = Math.cos(0.82) * pipD;
    const pipY = Math.sin(0.82) * pipD;
    if (bot.pulse > 0.08) {
      ctx.save();
      ctx.globalAlpha = 0.25 + bot.pulse * 0.6;
      ctx.strokeStyle = bot.pip;
      ctx.lineWidth = 1.4;
      ctx.beginPath();
      ctx.arc(pipX, pipY, pipR + 3 + bot.pulse * 5, 0, Math.PI * 2);
      ctx.stroke();
      ctx.restore();
    }
    ctx.fillStyle = bot.pip;
    ctx.beginPath();
    ctx.arc(pipX, pipY, pipR, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }

  function draw() {
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.fillStyle = "#000";
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.setTransform(view.s, 0, 0, view.s, view.x, view.y);
    drawDeck();
    drawPool();
    drawFurniture();
    drawWalls();
    for (const bot of BOTS.slice().sort((a, b) => a.y - b.y)) drawBot(bot);
  }

  let last = performance.now();
  let simTime = 0;
  let hudAt = 0;

  function frame(now) {
    const dt = Math.min(0.033, (now - last) / 1000);
    last = now;
    simTime += dt;
    resize();
    step(dt, simTime);
    draw();
    if (now - hudAt > 800) {
      hudAt = now;
      const social = BOTS.find((bot) => bot.partner && bot.mode !== "roam");
      statusNode.textContent = social
        ? `${social.name} ${social.mode === "pair" ? "walks with" : social.mode === "seek" ? "heads toward" : "meets"} ${social.partner.name}.`
        : "Six units are roaming the courtyard house.";
    }
    requestAnimationFrame(frame);
  }

  const fullBtn = document.getElementById("full");
  const fullIcon = document.getElementById("full-icon");
  function setFullIcon() {
    const on = Boolean(document.fullscreenElement);
    fullBtn.setAttribute("aria-label", on ? "Exit fullscreen" : "Enter fullscreen");
    fullIcon.innerHTML = on
      ? '<path d="M9 3v6H3M15 3v6h6M9 21v-6H3M15 21v-6h6"/>'
      : '<path d="M8 3H3v5M16 3h5v5M8 21H3v-5M16 21h5v-5"/>';
  }
  function toggleFull() {
    const action = !document.fullscreenElement
      ? document.documentElement.requestFullscreen?.()
      : document.exitFullscreen?.();
    if (action && typeof action.catch === "function") action.catch(() => {});
  }
  fullBtn.addEventListener("click", toggleFull);
  document.addEventListener("fullscreenchange", setFullIcon);
  window.addEventListener("keydown", (event) => {
    if ((event.key === "f" || event.key === "F") && !event.metaKey && !event.ctrlKey && !event.altKey) {
      event.preventDefault();
      toggleFull();
    }
  });
  new ResizeObserver(resize).observe(canvas);
  resize();
  requestAnimationFrame(frame);
})();
</script>
